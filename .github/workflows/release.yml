# Publishes a GitHub Release when a version tag is pushed (git tag v1.0.1 && git push origin v1.0.1).
# The in-app updater (Settings > About) checks this repository's latest release and installs the asset for its OS.
name: release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: packageMsi
          - os: ubuntu-22.04
            package: packageDeb packageRpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: libmpv for the Windows installer
        # Not in git (120 MB): the installer bundles player/native/libmpv-2.dll from shinchiro's mpv builds.
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' --dir mpv-dev
          7z e mpv-dev/*.7z -oplayer/native libmpv-2.dll -y
          test -f player/native/libmpv-2.dll
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Package
        shell: bash
        run: |
          # The installers carry the tag's version, so the updater sees exactly what was released.
          v="${GITHUB_REF_NAME#v}"
          for t in ${{ matrix.package }}; do ./gradlew --no-configuration-cache "-Papp.version=$v" :desktop-app:$t; done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            desktop-app/build/compose/binaries/main/msi/*.msi
            desktop-app/build/compose/binaries/main/deb/*.deb
            desktop-app/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifacts keep their msi/ deb/ rpm/ folders: upload the files inside them.
          mapfile -t files < <(find dist -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \))
          printf '%s
' "${files[@]}"
          test ${#files[@]} -gt 0
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Streamlet $GITHUB_REF_NAME" --generate-notes
